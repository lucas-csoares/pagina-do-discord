<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header__content">
            <h1 class="app-header__title">Imagine um lugar...</h1>

            <p class="app-header__subtitle">
                …onde você possa pertencer a um clube escolar, um grupo de gamers,
                ou uma comunidade artística mundial. Onde você e alguns amigos
                possam passar um tempo juntos. Um lugar que torna fácil conversar
                todos os dias e socializar com mais frequência.
            </p>

            <div class="app-header__actions">
                <button class="app-header__button app-header__button--download" aria-label="Baixar Discord para Windows">
                    Baixar para Windows
                </button>

                <button class="app-header__button app-header__button--open" aria-label="Abrir Discord no navegador">
                    Abrir o Discord no seu navegador
                </button>
            </div>
        </div>
    </header>


    <main class="content">
        main
    </main>

    <footer class="footer">
        footer
    </footer>
</body>

</html>
